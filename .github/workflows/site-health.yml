name: Site health

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Safe Browsing and project sites
        id: check
        shell: bash
        run: python3 .github/scripts/site_health.py | tee report.txt
        continue-on-error: true
      - name: Open an issue if something is wrong
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label site-health --state open --json number --jq '.[].number')" ]; then
            gh label create site-health --color B60205 --force
            gh issue create --label site-health \
              --title "Site health check failed" \
              --body "$(printf 'The daily check found a problem.\n\n```\n%s\n```\n' "$(cat report.txt)")"
          fi
          exit 1
