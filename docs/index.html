<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isfar Baset · Data &amp; AI Portfolio</title>
  <meta name="description" content="Isfar Baset · Data analyst and data scientist in Northern Virginia. I build ML systems and explain them in plain English." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            foreground: "hsl(var(--foreground))",
            background: "hsl(var(--background))",
            "muted-foreground": "hsl(var(--muted-foreground))",
            border: "hsl(var(--border))",
            accent: "hsl(var(--accent))",
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --background: 34 25% 97%;
      --foreground: 24 10% 10%;
      --muted-foreground: 24 6% 38%;
      --border: 24 8% 86%;
      /* sage-green / sea-blue accent, between green and blue */
      --accent: 192 32% 38%;
      --accent-2: 165 22% 42%;
    }
    html { scroll-behavior: smooth; }
    html, body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .font-display { font-family: 'Inter', sans-serif; letter-spacing: -0.04em; }
    .paper-grain {
      background-image:
        radial-gradient(circle at 20% 10%, hsla(24,15%,80%,0.08) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, hsla(18,30%,70%,0.06) 0%, transparent 45%);
    }
    /* animated role text */
    .roll-mask { display: inline-block; vertical-align: baseline; height: 1em; overflow: hidden; line-height: 1; }
    .roll-track { display: flex; flex-direction: column; transition: transform 600ms cubic-bezier(.6,.05,.2,1); }
    .roll-track > span { height: 1em; line-height: 1; display: inline-flex; align-items: center; white-space: nowrap; }
    /* longest roles overflow the hero width on small phones; shrink just the animated word */
    @media (max-width: 480px) { .roll-mask { font-size: 0.8em; } }
    /* hide caption on touch, prevents sticky hover */
    @media (hover: none) {
      .reveal-caption { opacity: 1 !important; transform: none !important; }
    }
    /* subtle marquee for tape strip */
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 30s linear infinite; }
    /* hide scrollbar on the gallery thumbnail strip */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function cn(...classes) { return classes.filter(Boolean).join(" "); }

    /* ---------- Nav ---------- */
    function Nav() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const link = "font-mono text-[11px] uppercase tracking-[0.2em] text-foreground/70 hover:text-foreground transition-colors";
      return (
        <nav className={cn(
          "sticky top-0 z-50 transition-all duration-300",
          scrolled ? "bg-background/85 backdrop-blur border-b border-border/60" : "bg-transparent"
        )}>
          <div className="mx-auto max-w-5xl px-6 sm:px-10 py-4 flex items-center justify-between">
            <a href="#top" className="font-display font-black tracking-tight text-lg">
              Isfar<span className="text-[hsl(var(--accent))]">.</span>
            </a>
            <div className="flex items-center gap-6 sm:gap-8">
              <a className={link} href="#work">Work</a>
              <a className={link} href="#about">About</a>
              <a className={link} href="#studio">Studio</a>
              <a className={link} href="#contact">Contact</a>
            </div>
          </div>
        </nav>
      );
    }

    /* ---------- Animated role roller ---------- */
    function RoleRoller() {
      const roles = ["Data Analyst", "Data Scientist", "ML Engineer", "Storyteller", "Chronic Overthinker", "Espresso Apologist"];
      const [i, setI] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setI(p => (p + 1) % roles.length), 2200);
        return () => clearInterval(id);
      }, []);
      return (
        <span className="roll-mask align-baseline">
          <span className="roll-track" style={{ transform: `translateY(-${i}em)` }}>
            {roles.map((r, idx) => (
              <span key={idx} className="text-[hsl(var(--accent))] italic">{r}</span>
            ))}
            <span className="text-[hsl(var(--accent))] italic">{roles[0]}</span>
          </span>
        </span>
      );
    }

    /* ---------- Studio: lightbox for the art gallery ---------- */
    function Lightbox({ pieces, index, setIndex }) {
      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape") setIndex(null);
          else if (e.key === "ArrowRight") setIndex(i => (i + 1) % pieces.length);
          else if (e.key === "ArrowLeft") setIndex(i => (i - 1 + pieces.length) % pieces.length);
        };
        window.addEventListener("keydown", onKey);
        document.body.style.overflow = "hidden";
        return () => { window.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
      }, [pieces.length, setIndex]);
      const p = pieces[index];
      return (
        <div onClick={() => setIndex(null)}
          className="fixed inset-0 z-[100] flex items-center justify-center px-14 py-6 sm:p-10 bg-black/85 backdrop-blur-sm">
          <button aria-label="Close" onClick={() => setIndex(null)}
            className="absolute top-3 right-3 sm:top-4 sm:right-5 w-11 h-11 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-white text-2xl leading-none transition-colors">×</button>
          <button aria-label="Previous" onClick={(e) => { e.stopPropagation(); setIndex(i => (i - 1 + pieces.length) % pieces.length); }}
            className="absolute left-2 sm:left-6 w-11 h-11 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-white text-3xl leading-none pb-1 transition-colors">‹</button>
          <button aria-label="Next" onClick={(e) => { e.stopPropagation(); setIndex(i => (i + 1) % pieces.length); }}
            className="absolute right-2 sm:right-6 w-11 h-11 rounded-full flex items-center justify-center bg-white/10 hover:bg-white/20 text-white text-3xl leading-none pb-1 transition-colors">›</button>
          <figure onClick={(e) => e.stopPropagation()} className="max-w-3xl max-h-[88vh] flex flex-col items-center m-0">
            <img src={p.src} alt={p.title}
              className="max-h-[68vh] sm:max-h-[76vh] w-auto max-w-full rounded-md shadow-2xl object-contain" />
            <figcaption className="mt-4 text-center">
              <span className="font-display text-lg font-black text-white">{p.title}</span>
              <span className="block font-mono text-[10px] uppercase tracking-[0.22em] text-white/60 mt-1">{p.medium}</span>
            </figcaption>
          </figure>
        </div>
      );
    }

    /* ---------- Studio: drag carousel with animated thumbnail strip ---------- */
    const THUMB_FULL = 120;
    const THUMB_COLLAPSED = 36;
    /* small versions for the thumbnail strip so it doesn't pull full-size images */
    const thumbOf = (src) => src.replace("/art/", "/art/thumbs/");

    function GalleryCarousel({ pieces, onOpen }) {
      const [index, setIndex] = useState(0);
      const [dragging, setDragging] = useState(false);
      const [offset, setOffset] = useState(0);
      const startX = useRef(0);
      const moved = useRef(0);
      const containerRef = useRef(null);
      const thumbsRef = useRef(null);

      const clamp = (i) => Math.max(0, Math.min(pieces.length - 1, i));

      /* Drag state lives in refs as well as state: setPointerCapture retargets the
         subsequent click to the capturing element, so a tap has to be detected here
         on pointerup rather than via an onClick on the image. */
      const draggingRef = useRef(false);
      const offsetRef = useRef(0);

      const onPointerDown = (e) => {
        draggingRef.current = true;
        setDragging(true);
        startX.current = e.clientX;
        moved.current = 0;
        offsetRef.current = 0;
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      };
      const onPointerMove = (e) => {
        if (!draggingRef.current) return;
        const d = e.clientX - startX.current;
        moved.current = Math.max(moved.current, Math.abs(d));
        offsetRef.current = d;
        setOffset(d);
      };
      const endDrag = (e) => {
        if (!draggingRef.current) return;
        draggingRef.current = false;
        const w = containerRef.current ? containerRef.current.offsetWidth : 1;
        const off = offsetRef.current;
        const isTap = moved.current < 10 && e && e.type === "pointerup";
        if (!isTap && Math.abs(off) > w * 0.2) {
          setIndex(clamp(off > 0 ? index - 1 : index + 1));
        }
        offsetRef.current = 0;
        setOffset(0);
        setDragging(false);
        if (isTap) onOpen(index);
      };

      /* keep the active thumbnail centered when the strip overflows */
      useEffect(() => {
        const el = thumbsRef.current;
        if (!el || el.scrollWidth <= el.clientWidth) return;
        const active = el.querySelector('[data-active="true"]');
        if (!active) return;
        el.scrollTo({ left: active.offsetLeft - el.clientWidth / 2 + active.offsetWidth / 2, behavior: "smooth" });
      }, [index]);

      const current = pieces[index];
      /* arrows are desktop-only: on touch, swiping and the thumbnail strip cover it
         and the buttons would sit on top of the artwork */
      const arrow = "absolute top-1/2 -translate-y-1/2 w-10 h-10 rounded-full hidden sm:flex items-center justify-center border border-border/70 bg-background/90 backdrop-blur shadow-sm transition-all z-10";

      return (
        <div className="flex flex-col gap-3">
          {/* main frame */}
          <div ref={containerRef} className="relative overflow-hidden rounded-md border border-border/70 bg-[hsl(var(--foreground)/0.04)]">
            <div
              className="flex touch-pan-y"
              style={{
                transform: `translateX(calc(${-index * 100}% + ${offset}px))`,
                transition: dragging ? "none" : "transform 500ms cubic-bezier(.6,.05,.2,1)",
                cursor: dragging ? "grabbing" : "grab",
              }}
              onPointerDown={onPointerDown}
              onPointerMove={onPointerMove}
              onPointerUp={endDrag}
              onPointerCancel={endDrag}
            >
              {pieces.map((p, i) => (
                <div key={p.src} className="shrink-0 w-full h-[440px] sm:h-[520px] flex items-center justify-center p-3 sm:p-5">
                  <img src={p.src} alt={p.title} draggable={false} loading={i === 0 ? "eager" : "lazy"}
                    className="max-h-full max-w-full object-contain rounded-sm shadow-md select-none cursor-zoom-in" />
                </div>
              ))}
            </div>

            <button aria-label="Previous piece" disabled={index === 0} onClick={() => setIndex(i => clamp(i - 1))}
              className={cn(arrow, "left-3 sm:left-4", index === 0 ? "opacity-30 cursor-not-allowed" : "hover:scale-110 hover:bg-background")}>
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7" /></svg>
            </button>
            <button aria-label="Next piece" disabled={index === pieces.length - 1} onClick={() => setIndex(i => clamp(i + 1))}
              className={cn(arrow, "right-3 sm:right-4", index === pieces.length - 1 ? "opacity-30 cursor-not-allowed" : "hover:scale-110 hover:bg-background")}>
              <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" /></svg>
            </button>

            <span className="absolute top-3 right-3 sm:right-4 font-mono text-[10px] uppercase tracking-[0.2em] text-muted-foreground bg-background/85 border border-border/60 rounded-full px-2.5 py-1">
              {String(index + 1).padStart(2, "0")} / {String(pieces.length).padStart(2, "0")}
            </span>
          </div>

          {/* caption */}
          <div className="flex flex-col sm:flex-row sm:items-baseline sm:justify-between gap-1 sm:gap-4">
            <div className="min-w-0">
              <span className="font-display text-lg sm:text-xl font-black tracking-tight">{current.title}</span>
              <span className="ml-2.5 font-mono text-[10px] uppercase tracking-[0.2em] text-muted-foreground whitespace-nowrap">{current.medium}</span>
            </div>
            <span className="shrink-0 font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground whitespace-nowrap">
              <span className="sm:hidden">Swipe &nbsp;·&nbsp; tap</span>
              <span className="hidden sm:inline">Drag &nbsp;·&nbsp; tap to enlarge</span>
            </span>
          </div>

          {/* thumbnail strip */}
          <div ref={thumbsRef} className="overflow-x-auto scrollbar-hide" style={{ scrollbarWidth: "none", msOverflowStyle: "none" }}>
            <div className="flex gap-1 h-20 mx-auto" style={{ width: "fit-content" }}>
              {pieces.map((p, i) => (
                <button key={p.src} data-active={i === index} onClick={() => setIndex(i)}
                  aria-label={p.title}
                  style={{ width: i === index ? THUMB_FULL : THUMB_COLLAPSED, transition: "width 300ms ease-out" }}
                  className={cn("relative shrink-0 h-full overflow-hidden rounded-sm border transition-colors",
                    i === index ? "border-[hsl(var(--accent))]" : "border-border/60 opacity-60 hover:opacity-100")}>
                  <img src={thumbOf(p.src)} alt="" loading="lazy" draggable={false}
                    onError={(e) => { e.currentTarget.src = p.src; }}
                    className="w-full h-full object-cover pointer-events-none select-none" />
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }
