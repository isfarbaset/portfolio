<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Isfar Baset — Data &amp; AI Portfolio</title>
  <meta name="description" content="Isfar Baset · Data Analyst & Data Scientist · Building tailored data and AI systems that translate research into real-world impact." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            foreground: "hsl(var(--foreground))",
            background: "hsl(var(--background))",
            "muted-foreground": "hsl(var(--muted-foreground))",
            border: "hsl(var(--border))",
            accent: "hsl(var(--accent))",
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    :root {
      --background: 34 25% 97%;
      --foreground: 24 10% 10%;
      --muted-foreground: 24 6% 38%;
      --border: 24 8% 86%;
      /* sage-green / sea-blue accent — between green and blue */
      --accent: 192 32% 38%;
      --accent-2: 165 22% 42%;
    }
    html { scroll-behavior: smooth; }
    html, body { background: hsl(var(--background)); color: hsl(var(--foreground)); }
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .font-display { font-family: 'Inter', sans-serif; letter-spacing: -0.04em; }
    .paper-grain {
      background-image:
        radial-gradient(circle at 20% 10%, hsla(24,15%,80%,0.08) 0%, transparent 45%),
        radial-gradient(circle at 80% 85%, hsla(18,30%,70%,0.06) 0%, transparent 45%);
    }
    /* animated role text */
    .roll-mask { display: inline-block; vertical-align: baseline; height: 1em; overflow: hidden; line-height: 1; }
    .roll-track { display: flex; flex-direction: column; transition: transform 600ms cubic-bezier(.6,.05,.2,1); }
    .roll-track > span { height: 1em; line-height: 1; display: inline-flex; align-items: center; }
    /* hide caption on touch — prevents sticky hover */
    @media (hover: none) {
      .reveal-caption { opacity: 1 !important; transform: none !important; }
    }
    /* tiny dot pattern for hero side */
    .dotgrid {
      background-image: radial-gradient(hsl(var(--foreground) / 0.10) 1px, transparent 1px);
      background-size: 14px 14px;
    }
    /* subtle marquee for tape strip */
    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-track { animation: marquee 30s linear infinite; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen paper-grain">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function cn(...classes) { return classes.filter(Boolean).join(" "); }

    /* ---------- Nav ---------- */
    function Nav() {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 40);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const link = "font-mono text-[11px] uppercase tracking-[0.2em] text-foreground/70 hover:text-foreground transition-colors";
      return (
        <nav className={cn(
          "sticky top-0 z-50 transition-all duration-300",
          scrolled ? "bg-background/85 backdrop-blur border-b border-border/60" : "bg-transparent"
        )}>
          <div className="mx-auto max-w-5xl px-6 sm:px-10 py-4 flex items-center justify-between">
            <a href="#top" className="font-display font-black tracking-tight text-lg">
              Isfar<span data-comment-anchor="cc-1" className="text-[hsl(var(--accent))]">.</span>
            </a>
            <div className="flex items-center gap-6 sm:gap-8">
              <a className={link} href="#work">Work</a>
              <a className={link} href="#about">About</a>
              <a className={link} href="#contact">Contact</a>
            </div>
          </div>
        </nav>
      );
    }

    /* ---------- Animated role roller ---------- */
    function RoleRoller() {
      const roles = ["Data Analyst", "Data Scientist", "ML Engineer", "AI Builder", "Storyteller"];
      const [i, setI] = useState(0);
      useEffect(() => {
        const id = setInterval(() => setI(p => (p + 1) % roles.length), 2200);
        return () => clearInterval(id);
      }, []);
      return (
        <span className="roll-mask align-baseline">
          <span className="roll-track" style={{ transform: `translateY(-${i}em)` }}>
            {roles.map((r, idx) => (
              <span key={idx} data-comment-anchor="cc-1" className="text-[hsl(var(--accent))] italic">{r}</span>
            ))}
            <span className="text-[hsl(var(--accent))] italic">{roles[0]}</span>
          </span>
        </span>
      );
    }

    /* ---------- Hero ---------- */
    function Hero() {
      return (
        <section id="top" className="relative pt-10 sm:pt-16 pb-20 sm:pb-28">
          {/* background dot grid panel on the right */}
          <div className="absolute right-0 top-20 hidden md:block w-[220px] h-[220px] dotgrid opacity-60 pointer-events-none"></div>

          <div className="grid grid-cols-1 md:grid-cols-[1fr_auto] gap-10 md:gap-14 items-end">
            <div>
              <p className="font-mono text-xs uppercase tracking-[0.3em] text-muted-foreground mb-6">
                Isfar Baset &nbsp;·&nbsp; Northern Virginia
              </p>
              <h1 className="font-display text-[44px] sm:text-[68px] md:text-[80px] font-black leading-[0.95] tracking-tight max-w-3xl">
                I'm a <RoleRoller />
                <br className="hidden sm:block" /> building data &amp; AI that
                <br className="hidden sm:block" /> <span className="text-muted-foreground">actually ships.</span>
              </h1>

              <p className="mt-7 max-w-xl text-base sm:text-lg leading-relaxed text-foreground/75">
                Data Analyst II at Shift Digital, Master's in Data Science from Georgetown ('25).
                I make tailored ML systems and tell stories with the numbers behind them.
              </p>

              <div className="mt-9 flex flex-wrap items-center gap-3">
                <a href="#work" className="inline-flex items-center gap-2 bg-foreground text-background font-mono text-xs uppercase tracking-[0.2em] px-5 py-3 rounded-full hover:bg-[hsl(var(--accent))] transition-colors">
                  See the work
                  <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 9 9 3 M9 3 H4 M9 3 V8" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </a>
                <a href="#contact" className="inline-flex items-center gap-2 border border-border bg-background font-mono text-xs uppercase tracking-[0.2em] px-5 py-3 rounded-full hover:border-foreground transition-colors">
                  Get in touch
                </a>
                <a href="Isfar Baset Resume.pdf" target="_blank" rel="noopener noreferrer" className="font-mono text-xs uppercase tracking-[0.2em] text-foreground/60 hover:text-foreground transition-colors ml-1 underline-offset-4 hover:underline">
                  Resume ↗
                </a>
              </div>
            </div>

            {/* portrait */}
            <div className="relative justify-self-start md:justify-self-end">
              <div className="absolute -inset-3 bg-gradient-to-br from-[hsl(var(--accent))]/20 to-transparent rounded-full blur-2xl"></div>
              <img src="images/isfar-about.png" alt="Isfar Baset" data-comment-anchor="cc-2"
                className="relative w-56 h-56 sm:w-64 sm:h-64 object-cover rounded-full border border-border shadow-md" />
              <span className="absolute -bottom-3 -left-3 bg-background border border-border rounded-full px-3 py-1 font-mono text-[10px] uppercase tracking-[0.2em] text-foreground/70">
                ✦ hi there
              </span>
            </div>
          </div>
        </section>
      );
    }

    /* ---------- Marquee strip ---------- */
    function StripMarquee() {
      const items = ["Python", "PyTorch", "scikit-learn", "Hugging Face", "Spark", "Snowflake", "AWS Bedrock", "LangGraph", "Plotly", "Tableau", "Bayesian Inference", "SQL"];
      const Row = () => (
        <div className="flex items-center gap-10 px-5 shrink-0">
          {items.map((s, i) => (
            <React.Fragment key={i}>
              <span className="font-mono text-xs uppercase tracking-[0.25em] text-foreground/70 whitespace-nowrap">{s}</span>
              <span className="w-1.5 h-1.5 rounded-full bg-[hsl(var(--accent))]/80"></span>
            </React.Fragment>
          ))}
        </div>
      );
      return (
        <div className="border-y border-border/70 py-4 bg-background/50 overflow-hidden">
          <div className="marquee-track flex" style={{ width: "max-content" }}>
            <Row /><Row />
          </div>
        </div>
      );
    }

    /* ---------- Reveal card ---------- */
    function RevealCard({ project, durationClass }) {
      return (
        <a
          href={project.href}
          target="_blank"
          rel="noopener noreferrer"
          className={cn(
            "w-16 h-20",
            "group-hover:w-[15rem] group-hover:h-[11rem] sm:group-hover:w-[17rem] sm:group-hover:h-[12rem]",
            "relative block rounded-md overflow-hidden bg-neutral-300",
            "shadow-sm group-hover:shadow-2xl",
            "transition-all duration-500 delay-100",
            durationClass
          )}
        >
          <img alt={project.title} src={project.src}
            className="h-full w-full object-cover transition-transform duration-700 group-hover:scale-[1.04]" />
          <div className={cn(
            "reveal-caption absolute inset-0 flex flex-col justify-end p-3.5 sm:p-4",
            "bg-gradient-to-t from-black/90 via-black/40 to-transparent",
            "opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0",
            "transition-all duration-500 delay-300"
          )}>
            <span className="font-mono text-[9px] uppercase tracking-[0.2em] text-white/70 mb-1.5">{project.kicker}</span>
            <h4 className="font-display text-lg sm:text-xl font-black text-white leading-tight mb-1">{project.title}</h4>
            <p className="text-[12px] sm:text-[13px] text-white/85 leading-snug line-clamp-3">{project.description}</p>
            <span className="mt-2 inline-flex items-center gap-1.5 font-mono text-[10px] uppercase tracking-[0.2em] text-white">
              View project
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="1.6"><path d="M3 9 9 3 M9 3 H4 M9 3 V8" strokeLinecap="round" strokeLinejoin="round"/></svg>
            </span>
          </div>
        </a>
      );
    }

    function RevealRow({ text, projects }) {
      const containerBase = "absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-40";
      return (
        <div className="group relative w-full min-h-[12rem] flex items-center overflow-visible">
          <h2 className="font-display text-5xl sm:text-7xl font-black text-foreground transition-all duration-500 group-hover:opacity-25 group-hover:tracking-tight pointer-events-none relative z-10">
            {text}
          </h2>
          <div className={cn(containerBase, "z-30")}>
            <RevealCard project={projects[1]} />
          </div>
          <div
            className={cn(containerBase,
              "z-40 translate-x-0 rotate-0",
              "group-hover:-translate-x-[15.5rem] sm:group-hover:-translate-x-[17.5rem] group-hover:rotate-[-3deg]",
              "transition-all duration-500 delay-150")}
            style={{ transformOrigin: "right center" }}
          >
            <RevealCard project={projects[0]} durationClass="duration-200" />
          </div>
        </div>
      );
    }

    function RevealImageList() {
      const items = [
        {
          text: "Machine Learning",
          projects: [
            { kicker: "Spotify · Plotly · scikit-learn", title: "Defying Analytics", description: "What 20 years of Wicked streaming data reveals about what actually makes a song stick. Length doesn't matter — vulnerability does.", src: "images/wicked.jpg", href: "wicked.html" },
            { kicker: "Python · ML · Spotify API", title: "Beats and Bytes", description: "Patterns in popular music through analysis, visualizations, and predictive models — what audio features actually predict popularity.", src: "images/beat-bytes.jpg", href: "Group37_final_Report.html" },
          ],
        },
        {
          text: "Conversational AI",
          projects: [
            { kicker: "Bedrock · LangGraph · Lambda", title: "FMBench Assistant", description: "A conversational AI that walks users through foundation-model benchmarking choices in natural dialogue instead of dense docs.", src: "images/fmbench.jpg", href: "https://medium.com/@isfarbaset/fmbench-assistant-an-ai-chatbot-for-navigating-foundation-model-benchmarking-with-fmbench-39615ff08161" },
            { kicker: "GPT-4 · MCP · Async Python", title: "Air Quality Intelligence", description: "Ask about air quality in any city and get health-aware advice for jogging, cycling, travel — built on a custom MCP server.", src: "images/aqi.jpg", href: "aqi.html" },
          ],
        },
        {
          text: "Data Storytelling",
          projects: [
            { kicker: "Python · Pandas · Dashboards", title: "Netflix Recap", description: "Turn your Netflix watch history into a personal year-in-review — viewing patterns, binge habits, and genre obsessions, visualized.", src: "images/netflix.png", href: "https://isfarbaset.github.io/netflix-recap/" },
            { kicker: "GitHub API · Canvas · JS", title: "GitHub Insights", description: "Drop in a username, get a downloadable stats card — lifetime activity, streaks, top repos, and developer-personality badges.", src: "images/git-insights.png", href: "https://isfarbaset.github.io/github-insights/" },
          ],
        },
        {
          text: "Web Apps",
          projects: [
            { kicker: "React · IndexedDB · PWA", title: "Almanac", description: "A private, local-only menstrual tracker. No accounts, no servers — period data stays in your browser. Built post-FTC-Flo.", src: "images/almanac.jpg", href: "https://isfarbaset.github.io/almanac/" },
            { kicker: "JS · Quarto · Interactive Map", title: "DMV Blooms", description: "A seasonal field guide to flowers across DC, Maryland & Virginia — what's peaking now and where to chase it across 28 spots.", src: "images/dmv-blooms.jpg", href: "https://isfarbaset.github.io/dmv-blooms/" },
          ],
        },
        {
          text: "Analytics",
          projects: [
            { kicker: "NLP · Sentiment · Reddit", title: "US Insights", description: "Sentiment patterns across U.S. states based on Reddit conversations — what each state is talking about and how it feels.", src: "images/us-insights.jpg", href: "https://isfarbaset.github.io/fall-2024-project-team-29/" },
            { kicker: "Climate · Time Series", title: "Temp Talk", description: "Climate trends across Southeastern Utah national parks and their impact on heat, soil, evaporation, and precipitation cycles.", src: "images/temp-talk.jpg", href: "https://isfarbaset.github.io/story-project/" },
          ],
        },
      ];

      return (
        <div className="flex flex-col gap-1 rounded-sm bg-background px-6 sm:px-10 py-8">
          <h3 className="font-mono text-xs font-medium uppercase tracking-[0.25em] text-muted-foreground mb-2">
            What I work on
          </h3>
          {items.map((item, i) => (
            <RevealRow key={i} text={item.text} projects={item.projects} />
          ))}
        </div>
      );
    }

    /* ---------- About ---------- */
    function About() {
      return (
        <section id="about" className="grid grid-cols-1 md:grid-cols-[200px_1fr] gap-8 md:gap-14 items-start py-20">
          <div className="relative">
            <div className="absolute -inset-2 bg-gradient-to-br from-[hsl(var(--accent))]/15 to-transparent rounded-full blur-xl"></div>
            <img src="images/isfar-about.png" alt="Isfar Baset"
              className="relative w-44 h-44 rounded-full object-cover border border-border/70 shadow-md" />
            <div className="mt-5 font-mono text-[11px] uppercase tracking-[0.18em] text-muted-foreground space-y-1.5">
              <div className="flex justify-between"><span>Based</span><span className="text-foreground">Northern VA</span></div>
              <div className="flex justify-between"><span>From</span><span className="text-foreground">Dhaka, BD</span></div>
              <div className="flex justify-between"><span>Coffee</span><span className="text-foreground">Black, daily</span></div>
            </div>
          </div>
          <div>
            <p className="font-mono text-xs uppercase tracking-[0.25em] text-muted-foreground mb-3">About</p>
            <h2 className="font-display text-3xl sm:text-4xl font-black tracking-tight leading-[1.1] mb-6">
              Hi, I'm Isfar. <span className="text-muted-foreground">I build data &amp; AI systems that translate research into real-world impact.</span>
            </h2>
            <p className="text-[15px] sm:text-base leading-relaxed text-foreground/80 max-w-2xl mb-4">
              Originally from <strong className="font-semibold text-foreground">Dhaka</strong>, now in Northern Virginia. I'm a <strong className="font-semibold text-foreground">Data Analyst II</strong> at Shift Digital, where I work on analytics for enterprise clients, and I hold a <strong className="font-semibold text-foreground">Master's in Data Science &amp; Analytics</strong> from Georgetown ('25).
            </p>
            <p className="text-[15px] sm:text-base leading-relaxed text-foreground/80 max-w-2xl mb-8">
              My favorite work lives at the intersection of <em>tailored algorithms</em> and <em>plain-English storytelling</em> — building models that solve specific business problems, and explaining them in a way non-technical stakeholders can actually act on. Off-keyboard I'm usually in a café, painting, reading, or chasing a new cuisine.
            </p>

            {/* Skills grid */}
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-x-6 gap-y-4 max-w-2xl text-sm">
              {[
                ["Programming", "Python · SQL · R · Java"],
                ["Machine Learning", "scikit-learn · PyTorch · XGBoost"],
                ["NLP", "spaCy · Hugging Face · BERT"],
                ["Data Viz", "Plotly · Tableau · Seaborn"],
                ["Big Data & Cloud", "Spark · Databricks · AWS"],
                ["Databases", "Postgres · Snowflake · Mongo"],
              ].map(([k, v]) => (
                <div key={k}>
                  <div className="font-mono text-[10px] uppercase tracking-[0.18em] text-muted-foreground mb-1">{k}</div>
                  <div className="text-foreground/85">{v}</div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    /* ---------- Contact ---------- */
    function Contact() {
      const links = [
        { label: "Email",     value: "isfar.baset@gmail.com", href: "mailto:isfar.baset@gmail.com" },
        { label: "LinkedIn",  value: "/in/isfarbaset",    href: "https://www.linkedin.com/in/isfarbaset/" },
        { label: "GitHub",    value: "@isfarbaset",       href: "https://github.com/isfarbaset" },
        { label: "Instagram", value: "@is.far",            href: "https://www.instagram.com/is.far/" },
      ];
      return (
        <section id="contact" className="py-20 sm:py-28">
          <p className="font-mono text-xs uppercase tracking-[0.3em] text-muted-foreground mb-4">Contact</p>
          <h2 className="font-display text-4xl sm:text-6xl font-black tracking-tight leading-[1.02] max-w-3xl">
            Want to build something together? <span className="text-muted-foreground">Or just talk café recommendations.</span>
          </h2>

          <div className="mt-12 grid grid-cols-1 sm:grid-cols-2 gap-px bg-border/70 border border-border/70 rounded-md overflow-hidden">
            {links.map(l => (
              <a key={l.label} href={l.href} target={l.href.startsWith('mailto:') ? undefined : "_blank"} rel="noopener noreferrer"
                 className="group block bg-background hover:bg-foreground hover:text-background transition-colors p-6">
                <div className="flex items-center justify-between">
                  <div>
                    <div className="font-mono text-[10px] uppercase tracking-[0.22em] opacity-70 mb-1.5">{l.label}</div>
                    <div className="font-display text-2xl font-black tracking-tight">{l.value}</div>
                  </div>
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
                       className="opacity-50 group-hover:opacity-100 group-hover:rotate-[-45deg] transition-all">
                    <path d="M5 12 H19 M19 12 L13 6 M19 12 L13 18" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
              </a>
            ))}
          </div>
        </section>
      );
    }

    /* ---------- App ---------- */
    function App() {
      return (
        <>
          <Nav />
          <main className="mx-auto max-w-5xl px-6 sm:px-10">
            <Hero />
          </main>

          <StripMarquee />

          <main className="mx-auto max-w-5xl px-6 sm:px-10">
            <section id="work" className="py-20">
              <div className="flex items-end justify-between flex-wrap gap-4 mb-8">
                <div>
                  <p className="font-mono text-xs uppercase tracking-[0.3em] text-muted-foreground mb-3">Work</p>
                  <h2 className="font-display text-4xl sm:text-5xl font-black tracking-tight leading-[1.05]">
                    Selected projects.
                  </h2>
                </div>
                <p className="font-mono text-[11px] uppercase tracking-[0.2em] text-muted-foreground max-w-xs">
                  Hover any category — peek at the work. Click a card to open the project.
                </p>
              </div>

              <div className="border border-border/70 bg-background rounded-md shadow-[0_1px_0_rgba(0,0,0,0.02),0_24px_60px_-30px_rgba(20,12,4,0.15)]">
                <RevealImageList />
              </div>
            </section>

            <About />
            <Contact />
          </main>

          <footer className="border-t border-border/70 mt-10">
            <div className="mx-auto max-w-5xl px-6 sm:px-10 py-8 flex flex-wrap items-center justify-between gap-4 font-mono text-xs text-muted-foreground">
              <span>© {new Date().getFullYear()} Isfar Baset · Built with coffee &amp; care.</span>
              <div className="flex gap-5">
                <a className="hover:text-foreground transition-colors" href="https://www.linkedin.com/in/isfarbaset/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
                <a className="hover:text-foreground transition-colors" href="https://github.com/isfarbaset" target="_blank" rel="noopener noreferrer">GitHub</a>
                <a className="hover:text-foreground transition-colors" href="https://www.instagram.com/is.far/" target="_blank" rel="noopener noreferrer">Instagram</a>
              </div>
            </div>
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
